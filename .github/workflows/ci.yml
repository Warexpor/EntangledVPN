name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go vet ./...
      - run: go test ./...

  client-vpncore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go vet ./vpncore/...
      - run: go test ./vpncore/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
